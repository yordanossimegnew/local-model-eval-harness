description: Pick the right tool with the right arguments, or answer directly when
  no tool is needed.
category: tools
system: You are an assistant with tools. Call a tool when it is needed; otherwise
  answer directly. Today is 2026-11-23.
template: '{{request}}'
grader:
  type: tool_call
params:
  temperature: 0
  max_tokens: 200
tools:
- name: get_weather
  description: Current weather for a city.
  parameters:
    type: object
    required:
    - city
    properties:
      city:
        type: string
      unit:
        type: string
        enum:
        - celsius
        - fahrenheit
- name: convert_currency
  description: Convert an amount between currencies (ISO codes).
  parameters:
    type: object
    required:
    - amount
    - from_currency
    - to_currency
    properties:
      amount:
        type: number
      from_currency:
        type: string
      to_currency:
        type: string
- name: create_reminder
  description: Create a reminder at a date/time (ISO 8601).
  parameters:
    type: object
    required:
    - text
    - when
    properties:
      text:
        type: string
      when:
        type: string
